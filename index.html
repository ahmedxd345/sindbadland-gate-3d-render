</style>
</head>
<body>
<div id="panel">
  <h1>The Sindbad Gate - finished look</h1>
  <div class="lbl">View</div>
  <div class="row">
    <button data-v="hero">3D</button><button data-v="front">Front</button><button data-v="back">Back</button>
    <button data-v="eye">Eye level</button><button data-v="side">Side</button><button data-v="aerial">Aerial</button><button data-v="round">Roundabout</button><button data-v="inside">From inside</button><button data-v="park">Toward park</button><button data-v="lake">Lake road</button><button data-v="stage">Concert stage</button>
  </div>
  <div class="lbl">Time of day</div>
  <div class="row"><button data-t="day" class="on">Day</button><button data-t="dusk">Dusk (lit)</button></div>
  <div class="lbl">Arch</div>
  <div class="row"><button data-a="coated" class="on">Limestone</button><button data-a="black">Black cladding</button><button data-a="steel">Bare steel</button></div>
</div>
<div id="hint">Drag to rotate &middot; scroll or pinch to zoom &middot; right-drag (or Shift + drag) to move</div>
<div id="err">The 3D engine could not be loaded. This page needs an internet connection the first time it opens.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (!window.THREE) { document.getElementById('err').style.display = 'flex'; }
else (function () {

  });

  // ================= limestone cladding =================
